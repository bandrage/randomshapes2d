    return;
  }

  if (isPlace) {
    const isCustom     = cfg.shape === 'custom';
    const isStrokeOnly = STROKE_ONLY.has(cfg.shape);

    setDisabled(pModeSection, isCustom || isStrokeOnly);
    setDisabled(paintColorGroup, isCustom);
    setDisabled(blendRow, false);

    setDisabled(bSmoothRow, false);
    setDisabled(bAlphaRow, false);

  } else if (isPaint) {
    const isLine  = cfg.paintMode === 'line';
    const isErase = cfg.paintMode === 'erase';

    setDisabled(pModeSection, false);
    setDisabled(bSmoothRow, !isLine);
    setDisabled(bAlphaRow, isErase);
    setDisabled(paintColorGroup, isErase);
    setDisabled(blendRow, isErase);
  }
}

/* =========================================================
   ★ 选区系统
   ========================================================= */
let selectionOps = [];
let selectionMaskCvs = null;
let selectionInvMaskCvs = null;
let selectionInverted = false;
let selectionContours = [];    // [{x, y}, ...][] 每个轮廓一个数组，CSS 坐标

let lassoActive = false;
let lassoPoints = [];
let lassoPointerId = null;
let lassoModifier = 'new';
let lassoColor = '#6ee7ff';

let moveActive = false;
let moveStartX = 0, moveStartY = 0;
let moveCurDxCss = 0, moveCurDyCss = 0;
let moveSnapshot = null;
let movePointerId = null;

function pointsToPath(points, scale) {
  const p = new Path2D();
  p.moveTo(points[0].x * scale, points[0].y * scale);
  for (let i = 1; i < points.length; i++) p.lineTo(points[i].x * scale, points[i].y * scale);
  p.closePath();
  return p;
}

/* ★ 从 mask 提取闭合轮廓（边缘追踪算法） */
function maskToContours(maskCvs) {
  const W = maskCvs.width;
  const H = maskCvs.height;
  if (W === 0 || H === 0) return [];

  let data;
  try {
    data = maskCvs.getContext('2d').getImageData(0, 0, W, H).data;
  } catch (e) {
    return [];
  }

  const mask = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) {
    mask[i] = data[i * 4 + 3] > 128 ? 1 : 0;
  }

  const adj = new Map();

  function addEdge(x1, y1, x2, y2) {
    const k1 = x1 + ',' + y1;
    const k2 = x2 + ',' + y2;
    if (!adj.has(k1)) adj.set(k1, []);
    if (!adj.has(k2)) adj.set(k2, []);
    adj.get(k1).push({ x: x2, y: y2 });
    adj.get(k2).push({ x: x1, y: y1 });
  }

  for (let y = 0; y < H; y++) {
    for (let x = 0; x <= W; x++) {
      const left  = x > 0 ? mask[y * W + (x - 1)] : 0;
      const right = x < W ? mask[y * W + x] : 0;
      if (left !== right) addEdge(x, y, x, y + 1);
    }
  }
  for (let x = 0; x < W; x++) {
    for (let y = 0; y <= H; y++) {
      const top    = y > 0 ? mask[(y - 1) * W + x] : 0;
      const bottom = y < H ? mask[y * W + x] : 0;
      if (top !== bottom) addEdge(x, y, x + 1, y);
    }
  }

  const used = new Set();
  function edgeKey(x1, y1, x2, y2) {
    if (x1 < x2 || (x1 === x2 && y1 < y2)) return x1 + ',' + y1 + '|' + x2 + ',' + y2;
    return x2 + ',' + y2 + '|' + x1 + ',' + y1;
  }

  const contours = [];
  const startKeys = Array.from(adj.keys());

  for (const key of startKeys) {
    const nbs = adj.get(key);
    if (!nbs || nbs.length === 0) continue;

    for (const nb of nbs) {
      const parts = key.split(',');
      const sx = parseInt(parts[0], 10);
      const sy = parseInt(parts[1], 10);
      const ek = edgeKey(sx, sy, nb.x, nb.y);
      if (used.has(ek)) continue;

      const contour = [];
      let cx = sx, cy = sy;
      let nx = nb.x, ny = nb.y;
      contour.push({ x: cx, y: cy });

      let guard = 0;
      while (guard++ < 500000) {
        used.add(edgeKey(cx, cy, nx, ny));
        contour.push({ x: nx, y: ny });

        if (nx === sx && ny === sy) break;

        const neighbors = adj.get(nx + ',' + ny) || [];
        let found = null;
        for (const n2 of neighbors) {
          const nk = edgeKey(nx, ny, n2.x, n2.y);
          if (!used.has(nk)) { found = n2; break; }
        }
        if (!found) break;

        cx = nx; cy = ny;
        nx = found.x; ny = found.y;
      }

      if (contour.length >= 4) {
        contours.push(contour);
      }
    }
  }

  return contours;
}

function rebuildSelection() {
  const W = baseCvs.width, H = baseCvs.height;

  if (!W || !H || selectionOps.length === 0) {
    selectionMaskCvs = null;
    selectionInvMaskCvs = null;
    selectionContours = [];
    return;
  }

  const mc = document.createElement('canvas');
  mc.width = W; mc.height = H;
  const mtc = mc.getContext('2d');
  mtc.setTransform(1, 0, 0, 1, 0, 0);

  for (const { points, op } of selectionOps) {
    if (points.length < 3) continue;
    const path = pointsToPath(points, dpr);
    mtc.globalCompositeOperation = op === 'sub' ? 'destination-out' : 'source-over';
    mtc.fillStyle = '#fff';
    mtc.fill(path);
  }
  mtc.globalCompositeOperation = 'source-over';
  selectionMaskCvs = mc;

  const inv = document.createElement('canvas');
  inv.width = W; inv.height = H;
  const ic = inv.getContext('2d');
  ic.setTransform(1, 0, 0, 1, 0, 0);
  ic.fillStyle = '#fff';
  ic.fillRect(0, 0, W, H);
  ic.globalCompositeOperation = 'destination-out';
  ic.drawImage(mc, 0, 0);
  ic.globalCompositeOperation = 'source-over';
  selectionInvMaskCvs = inv;

  const rawContours = maskToContours(mc);
  selectionContours = rawContours.map(c =>
    c.map(p => ({ x: p.x / dpr, y: p.y / dpr }))
  );

  startDashAnim();
}

function getActiveMaskCvs() {
  return selectionInverted ? selectionInvMaskCvs : selectionMaskCvs;
}

function hasSelection() {
  return selectionOps.length > 0 && !!selectionMaskCvs;
}

function clearSelection() {
  selectionOps = [];
  selectionInverted = false;
  selectionMaskCvs = null;
  selectionInvMaskCvs = null;
  selectionContours = [];
  renderView();
}

function invertSelection() {
  if (!hasSelection()) return;
  selectionInverted = !selectionInverted;
  renderView();
}

/* =========================================================
   Ctrl 移动
   ========================================================= */
function startMove(cssX, cssY, pointerId) {
  moveActive = true;
  movePointerId = pointerId;
  cvs.setPointerCapture(pointerId);
  moveStartX = cssX;
  moveStartY = cssY;
  moveCurDxCss = 0;
  moveCurDyCss = 0;

  takeSnapshot();

  moveSnapshot = document.createElement('canvas');
  moveSnapshot.width = baseCvs.width;
  moveSnapshot.height = baseCvs.height;
  moveSnapshot.getContext('2d').drawImage(baseCvs, 0, 0);
}

function updateMove(cssX, cssY) {
  moveCurDxCss = cssX - moveStartX;
  moveCurDyCss = cssY - moveStartY;
  const dxPx = moveCurDxCss * dpr;
  const dyPx = moveCurDyCss * dpr;

  const W = baseCvs.width;
  const H = baseCvs.height;

  bctx.save();
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.globalCompositeOperation = 'source-over';
  bctx.globalAlpha = 1;
  bctx.clearRect(0, 0, W, H);

  const activeMask = getActiveMaskCvs();

  if (activeMask) {
    const t1 = document.createElement('canvas');
    t1.width = W; t1.height = H;
    const t1c = t1.getContext('2d');
    t1c.setTransform(1, 0, 0, 1, 0, 0);
    t1c.drawImage(moveSnapshot, 0, 0);
    t1c.globalCompositeOperation = 'destination-out';
    t1c.drawImage(activeMask, 0, 0);
    t1c.globalCompositeOperation = 'source-over';

    bctx.drawImage(t1, 0, 0);

    const t2 = document.createElement('canvas');
    t2.width = W; t2.height = H;
    const t2c = t2.getContext('2d');
    t2c.setTransform(1, 0, 0, 1, 0, 0);
    t2c.drawImage(moveSnapshot, 0, 0);
    t2c.globalCompositeOperation = 'destination-in';
    t2c.drawImage(activeMask, 0, 0);
    t2c.globalCompositeOperation = 'source-over';

    bctx.drawImage(t2, dxPx, dyPx);

  } else {
    bctx.drawImage(moveSnapshot, dxPx, dyPx);
  }

  bctx.restore();
  renderView();
}

function endMove() {
  if (hasSelection() && (moveCurDxCss !== 0 || moveCurDyCss !== 0)) {
    const dx = moveCurDxCss, dy = moveCurDyCss;
    selectionOps = selectionOps.map(opt => ({
      op: opt.op,
      points: opt.points.map(p => ({ x: p.x + dx, y: p.y + dy }))
    }));
    rebuildSelection();
  }
  moveActive = false;
  movePointerId = null;
  moveSnapshot = null;
  moveCurDxCss = 0;
  moveCurDyCss = 0;
}

/* =========================================================
   ★★★ 自由变换（Ctrl+T）
   -------------------------------------------------
   四角锚点自由拖拽 → 扭曲 / 变形
   Shift + 拖角点 → 以中心等比缩放
   拖边中点      → 移动整条边
   顶部圆点      → 围绕中心旋转（Shift 吸附 15°）
   内部拖拽      → 整体移动
   Enter 提交 / Esc 取消 / 再按 Ctrl+T 提交
   ========================================================= */
let tfActive   = false;
let tfSnapshot = null;   // 进入变换时的整幅快照
let tfBase     = null;   // 快照 - 选区（内容被挖掉的底图）
let tfContent  = null;   // 选区内的像素
let tfCSSW     = 0, tfCSSH = 0;
let tfQuad     = null;   // [{x,y} x4] TL TR BR BL，CSS 坐标
let tfDrag     = null;

function getQuadCenter(q) {
  let x = 0, y = 0;
  for (const p of q) { x += p.x; y += p.y; }
  return { x: x / 4, y: y / 4 };
}

function getRotHandlePos(q) {
  const topMid = { x: (q[0].x + q[1].x) / 2, y: (q[0].y + q[1].y) / 2 };
  const c = getQuadCenter(q);
  let dx = topMid.x - c.x, dy = topMid.y - c.y;
  const len = Math.hypot(dx, dy);
  if (len < 1e-6) { dx = 0; dy = -1; }
  else { dx /= len; dy /= len; }
  return { x: topMid.x + dx * 34, y: topMid.y + dy * 34, ax: topMid.x, ay: topMid.y };
}

function pointInQuad(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function tfHitTest(x, y) {
  if (!tfQuad) return null;
  const q = tfQuad;
  const R = 11;

  const rp = getRotHandlePos(q);
  if (Math.hypot(x - rp.x, y - rp.y) < R + 3) return { type: 'rotate' };

  for (let i = 0; i < 4; i++) {
    if (Math.hypot(x - q[i].x, y - q[i].y) < R) return { type: 'corner', i };
  }
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    const mx = (q[i].x + q[j].x) / 2, my = (q[i].y + q[j].y) / 2;
    if (Math.hypot(x - mx, y - my) < R) return { type: 'edge', i };
  }
  if (pointInQuad(x, y, q)) return { type: 'move' };
  return null;
}

function updateTransformCursor(hit) {
  if (!hit) { cvs.style.cursor = 'default'; return; }
  if (hit.type === 'rotate')      cvs.style.cursor = 'grab';
  else if (hit.type === 'corner') cvs.style.cursor = 'nwse-resize';
  else if (hit.type === 'edge')   cvs.style.cursor = 'move';
  else                            cvs.style.cursor = 'move';
}

function enterTransform() {
  if (tfActive) return;
  if (!hasSelection()) { showToast('请先建立选区，再按 Ctrl+T'); return; }

  const W = baseCvs.width, H = baseCvs.height;
  const mask = getActiveMaskCvs();
  if (!mask) return;

  /* --- 计算选区包围盒 --- */
  let data;
  try {
    data = mask.getContext('2d').getImageData(0, 0, W, H).data;
  } catch (err) { return; }

  let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let y = 0; y < H; y++) {
    const rb = y * W;
    for (let x = 0; x < W; x++) {
      if (data[(rb + x) * 4 + 3] > 8) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < minX || maxY < minY) { showToast('选区为空'); return; }

  const bw = maxX - minX + 1;
  const bh = maxY - minY + 1;

  /* --- 快照 --- */
  takeSnapshot();
  tfSnapshot = document.createElement('canvas');
  tfSnapshot.width = W;
  tfSnapshot.height = H;
  tfSnapshot.getContext('2d').drawImage(baseCvs, 0, 0);

  /* --- 抠出内容 --- */
  tfContent = document.createElement('canvas');
  tfContent.width = bw;
  tfContent.height = bh;
  const cc = tfContent.getContext('2d');
  cc.drawImage(baseCvs, minX, minY, bw, bh, 0, 0, bw, bh);
  cc.globalCompositeOperation = 'destination-in';
  cc.drawImage(mask, minX, minY, bw, bh, 0, 0, bw, bh);
  cc.globalCompositeOperation = 'source-over';

  /* --- 底图：快照挖掉选区 --- */
  tfBase = document.createElement('canvas');
  tfBase.width = W;
  tfBase.height = H;
  const bc = tfBase.getContext('2d');
  bc.drawImage(tfSnapshot, 0, 0);
  bc.globalCompositeOperation = 'destination-out';
  bc.drawImage(mask, 0, 0);
  bc.globalCompositeOperation = 'source-over';

  /* --- 四边形（CSS 坐标） --- */
  const cx0 = minX / dpr, cy0 = minY / dpr;
  const cx1 = (minX + bw) / dpr, cy1 = (minY + bh) / dpr;
  tfQuad = [
    { x: cx0, y: cy0 },
    { x: cx1, y: cy0 },
    { x: cx1, y: cy1 },
    { x: cx0, y: cy1 }
  ];
  tfCSSW = bw / dpr;
  tfCSSH = bh / dpr;

  tfActive = true;
  tfDrag = null;
  cvs.style.cursor = 'default';

  renderTransform();
  showToast('自由变换：拖角点扭曲 · Shift拖角缩放 · 顶圆点旋转 · 内部拖动移动\nEnter 确定 / Esc 取消');
}

function cancelTransform() {
  if (!tfActive) return;
  const W = baseCvs.width, H = baseCvs.height;
  if (tfSnapshot) {
    bctx.save();
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.globalCompositeOperation = 'source-over';
    bctx.globalAlpha = 1;
    bctx.clearRect(0, 0, W, H);
    bctx.drawImage(tfSnapshot, 0, 0);
    bctx.restore();
  }
  tfActive = false;
  tfDrag = null;
  tfSnapshot = null;
  tfBase = null;
  tfContent = null;
  tfQuad = null;
  cvs.style.cursor = '';
  renderView();
}

function commitTransform() {
  if (!tfActive) return;
  const quad = tfQuad.map(p => ({ x: p.x, y: p.y }));

  tfActive = false;
  tfDrag = null;
  tfSnapshot = null;
  tfBase = null;
  tfContent = null;
  tfQuad = null;
  cvs.style.cursor = '';

  /* 把变换后的四边形作为新的选区轮廓 */
  selectionOps = [{ points: quad, op: 'new' }];
  selectionInverted = false;
  rebuildSelection();
  renderView();
}

/* 三角形仿射映射：把 img 画到任意四边形上（支持透视近似） */
function drawQuadImage(img, quad) {
  if (!img || !quad) return;
  const cw = tfCSSW, ch = tfCSSH;
  if (cw <= 0 || ch <= 0) return;

  const g = bctx;
  g.save();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';

  const tris = [
    { s: [0, 0, cw, 0, cw, ch], d: [0, 1, 2] },
    { s: [0, 0, cw, ch, 0, ch], d: [0, 2, 3] }
  ];

  for (const t of tris) {
    const sx0 = t.s[0], sy0 = t.s[1];
    const sx1 = t.s[2], sy1 = t.s[3];
    const sx2 = t.s[4], sy2 = t.s[5];
    const p0 = quad[t.d[0]], p1 = quad[t.d[1]], p2 = quad[t.d[2]];

    const det = (sx1 - sx0) * (sy2 - sy0) - (sx2 - sx0) * (sy1 - sy0);
    if (Math.abs(det) < 1e-9) continue;

    const a = ((p1.x - p0.x) * (sy2 - sy0) - (p2.x - p0.x) * (sy1 - sy0)) / det;
    const b = ((p1.y - p0.y) * (sy2 - sy0) - (p2.y - p0.y) * (sy1 - sy0)) / det;
    const c = ((p2.x - p0.x) * (sx1 - sx0) - (p1.x - p0.x) * (sx2 - sx0)) / det;
    const d = ((p2.y - p0.y) * (sx1 - sx0) - (p1.y - p0.y) * (sx2 - sx0)) / det;
    const e = p0.x - a * sx0 - c * sy0;
    const f = p0.y - b * sx0 - d * sy0;

    g.save();
    g.beginPath();
    g.moveTo(p0.x, p0.y);
    g.lineTo(p1.x, p1.y);
    g.lineTo(p2.x, p2.y);
    g.closePath();
    g.clip();
    g.transform(a, b, c, d, e, f);
    g.drawImage(img, 0, 0, cw, ch);
    g.restore();
  }

  g.restore();
}

function renderTransform() {
  if (!tfActive || !tfBase) return;
  const W = baseCvs.width, H = baseCvs.height;

  bctx.save();
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.globalCompositeOperation = 'source-over';
  bctx.globalAlpha = 1;
  bctx.clearRect(0, 0, W, H);
  bctx.drawImage(tfBase, 0, 0);
  bctx.restore();

  drawQuadImage(tfContent, tfQuad);

  renderView();
}

function applyTransformDrag(e) {
  if (!tfDrag || !tfQuad) return;
  const d = tfDrag;
  const oq = d.origQuad;
  const c = d.center;
  const dx = e.clientX - d.startX;
  const dy = e.clientY - d.startY;

  if (d.type === 'move') {
    tfQuad = oq.map(p => ({ x: p.x + dx, y: p.y + dy }));

  } else if (d.type === 'corner') {
    if (e.shiftKey) {
      const od = Math.hypot(oq[d.i].x - c.x, oq[d.i].y - c.y) || 1;
      const nd = Math.hypot(e.clientX - c.x, e.clientY - c.y);
      const s  = Math.max(0.02, nd / od);
      tfQuad = oq.map(p => ({
        x: c.x + (p.x - c.x) * s,
        y: c.y + (p.y - c.y) * s
      }));
    } else {
      tfQuad = oq.map(p => ({ x: p.x, y: p.y }));
      tfQuad[d.i] = { x: e.clientX, y: e.clientY };
    }

  } else if (d.type === 'edge') {
    const j = (d.i + 1) % 4;
    tfQuad = oq.map(p => ({ x: p.x, y: p.y }));
    tfQuad[d.i] = { x: oq[d.i].x + dx, y: oq[d.i].y + dy };
    tfQuad[j]   = { x: oq[j].x + dx,   y: oq[j].y + dy };

  } else if (d.type === 'rotate') {
    let ang = Math.atan2(e.clientY - c.y, e.clientX - c.x) - d.startAngle;
    if (e.shiftKey) {
      const step = Math.PI / 12;
      ang = Math.round(ang / step) * step;
    }
    const cs = Math.cos(ang), sn = Math.sin(ang);
    tfQuad = oq.map(p => {
      const px = p.x - c.x, py = p.y - c.y;
      return { x: c.x + px * cs - py * sn, y: c.y + px * sn + py * cs };
    });
  }

  renderTransform();
}

function drawTransformUI() {
  const q = tfQuad;
  if (!q) return;

  vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  vctx.save();
  vctx.setLineDash([]);

  /* 外框 */
  vctx.beginPath();
  vctx.moveTo(q[0].x, q[0].y);
  vctx.lineTo(q[1].x, q[1].y);
  vctx.lineTo(q[2].x, q[2].y);
  vctx.lineTo(q[3].x, q[3].y);
  vctx.closePath();

  vctx.lineWidth = 3;
  vctx.strokeStyle = 'rgba(0,0,0,.55)';
  vctx.stroke();

  vctx.lineWidth = 1.5;
  vctx.strokeStyle = '#6ee7ff';
  vctx.stroke();

  /* 对角线 */
  vctx.beginPath();
  vctx.moveTo(q[0].x, q[0].y); vctx.lineTo(q[2].x, q[2].y);
  vctx.moveTo(q[1].x, q[1].y); vctx.lineTo(q[3].x, q[3].y);
  vctx.lineWidth = 1;
  vctx.strokeStyle = 'rgba(110,231,255,.28)';
  vctx.stroke();

  const hs = 4.5;

  /* 角点锚点 */
  for (const p of q) {
    vctx.beginPath();
    vctx.rect(p.x - hs, p.y - hs, hs * 2, hs * 2);
    vctx.fillStyle = '#0e0e12';
    vctx.fill();
    vctx.lineWidth = 1.6;
    vctx.strokeStyle = '#6ee7ff';
    vctx.stroke();
  }

  /* 边中点锚点 */
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    const mx = (q[i].x + q[j].x) / 2;
    const my = (q[i].y + q[j].y) / 2;
    vctx.beginPath();
    vctx.arc(mx, my, 4, 0, TAU);
    vctx.fillStyle = '#0e0e12';
    vctx.fill();
    vctx.lineWidth = 1.6;
    vctx.strokeStyle = '#6ee7ff';
    vctx.stroke();
  }

  /* 旋转手柄 */
  const rp = getRotHandlePos(q);
  vctx.beginPath();
  vctx.moveTo(rp.ax, rp.ay);
  vctx.lineTo(rp.x, rp.y);
  vctx.lineWidth = 1;
  vctx.strokeStyle = 'rgba(110,231,255,.7)';
  vctx.stroke();

  vctx.beginPath();
  vctx.arc(rp.x, rp.y, 6.5, 0, TAU);
  vctx.fillStyle = '#0e0e12';
  vctx.fill();
  vctx.lineWidth = 1.6;
  vctx.strokeStyle = '#6ee7ff';
  vctx.stroke();

  vctx.beginPath();
  vctx.arc(rp.x, rp.y, 2.6, 0.6, 5.2);
  vctx.lineWidth = 1.3;
  vctx.strokeStyle = '#6ee7ff';
  vctx.stroke();

  vctx.restore();
  vctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* =========================================================
   自定义形状
   ========================================================= */
const CUSTOM_SLOT_COUNT = 5;
let customShapes  = new Array(CUSTOM_SLOT_COUNT).fill(null);
let customWeights = [2, 2, 2, 2, 2];
let selectingSlot = -1;

let selecting   = false;
let isSelDragging = false;
let selStartX = 0, selStartY = 0, selEndX = 0, selEndY = 0;
let selPointerId = null;

const customPanel   = document.getElementById('customPanel');
const customSlots   = document.getElementById('customSlots');
const selOverlay    = document.getElementById('selOverlay');

const previewEls = new Array(CUSTOM_SLOT_COUNT);
const weightEls  = new Array(CUSTOM_SLOT_COUNT);
const weightValEls = new Array(CUSTOM_SLOT_COUNT);

function buildCustomSlotsUI() {
  customSlots.innerHTML = '';
  for (let i = 0; i < CUSTOM_SLOT_COUNT; i++) {
    const slot = document.createElement('div');
    slot.className = 'custom-slot';

    const preview = document.createElement('div');
    preview.className = 'custom-preview';
    preview.dataset.idx = i;
    preview.addEventListener('click', () => {
      if (selecting && selectingSlot === i) exitSelectionMode();
      else { exitSelectionMode(); enterSelectionMode(i); }
    });
    previewEls[i] = preview;

    const weightRow = document.createElement('div');
    weightRow.className = 'custom-weight';

    const range = document.createElement('input');
    range.type = 'range';
    range.min = '0';
    range.max = '10';
    range.step = '1';
    range.value = String(customWeights[i]);
    range.dataset.idx = i;
    range.addEventListener('input', () => onWeightChange(i, parseInt(range.value, 10)));
    weightEls[i] = range;

    const val = document.createElement('i');
    val.textContent = String(customWeights[i]);
    weightValEls[i] = val;

    weightRow.appendChild(range);
    weightRow.appendChild(val);

    slot.appendChild(preview);
    slot.appendChild(weightRow);
    customSlots.appendChild(slot);

    updateSlotPreview(i);
  }
}

function onWeightChange(idx, newVal) {
  let otherSum = 0;
  for (let j = 0; j < CUSTOM_SLOT_COUNT; j++) {
    if (j !== idx) otherSum += customWeights[j];
  }
  const maxAllowed = Math.max(0, 10 - otherSum);
  const finalVal = Math.max(0, Math.min(newVal, maxAllowed));
  customWeights[idx] = finalVal;
  weightEls[idx].value = String(finalVal);
  weightValEls[idx].textContent = String(finalVal);
}

function updateSlotPreview(idx) {
  const preview = previewEls[idx];
  if (!preview) return;
  preview.innerHTML = '';

  const cs = customShapes[idx];
  if (!cs) {
    const empty = document.createElement('div');
    empty.className = 'custom-empty';
    empty.textContent = '点击载入';
    preview.appendChild(empty);
    return;
  }

  const boxW = preview.clientWidth  || 130;
  const boxH = preview.clientHeight || 66;
  const maxW = boxW - 8, maxH = boxH - 8;
  const scale = Math.min(maxW / cs.w, maxH / cs.h, 1);

  const c = document.createElement('canvas');
  c.width  = Math.max(1, Math.round(cs.w * scale * dpr));
  c.height = Math.max(1, Math.round(cs.h * scale * dpr));
  c.style.width  = (cs.w * scale) + 'px';
  c.style.height = (cs.h * scale) + 'px';
  const cx = c.getContext('2d');
  cx.drawImage(cs.canvas, 0, 0, c.width, c.height);
  preview.appendChild(c);

  const hint = document.createElement('div');
  hint.className = 'custom-hint';
  hint.textContent = '重选';
  preview.appendChild(hint);
}

function enterSelectionMode(slotIdx) {
  selecting = true;
  selectingSlot = slotIdx;
  previewEls[slotIdx].classList.add('selecting');
  cvs.style.cursor = 'crosshair';
  showToast('拖动框选要载入的形状区域');
}

function exitSelectionMode() {
  if (selectingSlot >= 0 && previewEls[selectingSlot]) {
    previewEls[selectingSlot].classList.remove('selecting');
  }
  selecting = false;
  selectingSlot = -1;
  isSelDragging = false;
  selPointerId = null;
  cvs.style.cursor = '';
  selOverlay.style.display = 'none';
}

function showToast(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:14px 22px;background:rgba(10,10,14,.92);color:#fff;
    border:1px solid rgba(110,231,255,.4);border-radius:12px;
    font-size:13px;letter-spacing:.02em;z-index:200;
    box-shadow:0 8px 30px rgba(0,0,0,.6);
    pointer-events:none;opacity:0;transition:opacity .18s;
    max-width:80vw;text-align:center;line-height:1.5;white-space:pre-line;
  `;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.style.opacity = '1');
  setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 250);
  }, 1900);
}

function updateSelOverlay() {
  const left = Math.min(selStartX, selEndX);
  const top  = Math.min(selStartY, selEndY);
  const w = Math.abs(selEndX - selStartX);
  const h = Math.abs(selEndY - selStartY);
  selOverlay.style.left   = left + 'px';
  selOverlay.style.top    = top + 'px';
  selOverlay.style.width  = w + 'px';
  selOverlay.style.height = h + 'px';
  selOverlay.style.display = 'block';
}

function cropShape(left, top, w, h) {
  if (selectingSlot < 0) return;

  const sx = Math.round(left * dpr);
  const sy = Math.round(top * dpr);
  const sw = Math.round(w * dpr);
  const sh = Math.round(h * dpr);
  if (sw < 4 || sh < 4) return;

  const cw = baseCvs.width, ch = baseCvs.height;
  const cx0 = Math.max(0, Math.min(cw - 1, sx));
  const cy0 = Math.max(0, Math.min(ch - 1, sy));
  const cw2 = Math.min(cw - cx0, sw);
  const ch2 = Math.min(ch - cy0, sh);
  if (cw2 < 4 || ch2 < 4) return;

  const c = document.createElement('canvas');
  c.width = cw2;
  c.height = ch2;
  const cx = c.getContext('2d');
  cx.drawImage(baseCvs, cx0, cy0, cw2, ch2, 0, 0, cw2, ch2);

  customShapes[selectingSlot] = { canvas: c, w: cw2 / dpr, h: ch2 / dpr };
  updateSlotPreview(selectingSlot);
}

function updateCustomPanelVisibility() {
  const show = cfg.tool === 'place' && cfg.shape === 'custom';
  customPanel.hidden = !show;
  if (show) {
    for (let i = 0; i < CUSTOM_SLOT_COUNT; i++) updateSlotPreview(i);
  } else {
    exitSelectionMode();
  }
}

function pickWeightedCustomShape() {
  const candidates = [];
  let total = 0;
  for (let i = 0; i < CUSTOM_SLOT_COUNT; i++) {
    if (customShapes[i] && customWeights[i] > 0) {
      candidates.push(i);
      total += customWeights[i];
    }
  }
  if (total <= 0) {
    const loaded = [];
    for (let i = 0; i < CUSTOM_SLOT_COUNT; i++) {
      if (customShapes[i]) loaded.push(i);
    }
    if (loaded.length === 0) return null;
    return customShapes[loaded[(Math.random() * loaded.length) | 0]];
  }
  let r = Math.random() * total;
  for (const i of candidates) {
    r -= customWeights[i];
    if (r <= 0) return customShapes[i];
  }
  return customShapes[candidates[candidates.length - 1]];
}

function hasAnyCustomShape() {
  for (let i = 0; i < CUSTOM_SLOT_COUNT; i++) {
    if (customShapes[i]) return true;
  }
  return false;
}

/* =========================================================
   放置
   ========================================================= */
function stampCustomShape(x, y, pressure, cs) {
  if (!cs) return;

  const p = (pressure && pressure > 0) ? pressure : 0.5;
  const scale = 0.55 + p * 0.9;
  const targetSize = cfg.pSize * scale * rnd(1 - cfg.pSizeVar, 1 + cfg.pSizeVar);

  const maxDim = Math.max(cs.w, cs.h);
  const s = targetSize / maxDim;

  let a = cfg.pAlpha;
  if (a >= 0.999) a = 1;
  else a *= rnd(0.75, 1);
  a = Math.min(1, Math.max(0.02, a));

  const rot = Math.random() * TAU;
  const ox = x + rnd(-cfg.pJitter, cfg.pJitter);
  const oy = y + rnd(-cfg.pJitter, cfg.pJitter);

  const g = sctx;
  g.save();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.globalCompositeOperation = cfg.blend;
  g.globalAlpha = a;
  g.translate(ox, oy);
  g.rotate(rot);
  g.drawImage(cs.canvas, -cs.w * s / 2, -cs.h * s / 2, cs.w * s, cs.h * s);
  g.restore();

  scheduleRender();
}

function stampShape(x, y, pressure) {
  const type = cfg.shape === 'random' ? pick(SHAPE_KEYS) : cfg.shape;

  if (type === 'custom') {
    const cs = pickWeightedCustomShape();
    if (!cs) return;
    stampCustomShape(x, y, pressure, cs);
    return;
  }

  const p = (pressure && pressure > 0) ? pressure : 0.5;
  const scale = 0.55 + p * 0.9;

  const base = cfg.pSize * scale * rnd(1 - cfg.pSizeVar, 1 + cfg.pSizeVar);
  const r = Math.max(0.8, base / 2);

  const dec = makeShapeDecision(type);

  const rot = Math.random() * TAU;
  const ox  = x + rnd(-cfg.pJitter, cfg.pJitter);
  const oy  = y + rnd(-cfg.pJitter, cfg.pJitter);

  const g = sctx;
  g.save();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.globalCompositeOperation = cfg.blend;
  g.globalAlpha = dec.alpha;
  g.translate(ox, oy);
  g.rotate(rot);
  g.lineWidth = dec.lw;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.fillStyle = dec.color;
  g.strokeStyle = dec.color;
  buildPath(g, type, r);
  if (dec.useFill) g.fill();
  else             g.stroke();
  g.restore();

  scheduleRender();
}

/* =========================================================
   拖拽
   ========================================================= */
let dragShape = null;

function startDragShape(x, y) {
  const type = cfg.shape === 'random' ? pick(SHAPE_KEYS) : cfg.shape;

  if (type === 'custom') {
    const cs = pickWeightedCustomShape();
    if (!cs) return;
    let a = cfg.pAlpha;
    if (a >= 0.999) a = 1;
    else a *= rnd(0.75, 1);
    a = Math.min(1, Math.max(0.02, a));

    dragShape = {
      isCustom: true,
      ox: x, oy: y,
      shapeCanvas: cs.canvas,
      shapeW: cs.w, shapeH: cs.h,
      alpha: a
    };
    strokeBlend = cfg.blend;
    strokeAlpha = 1;
    clearStrokeBuf();
    strokeActive = true;
    renderDragShape(x, y);
    return;
  }

  const dec = makeShapeDecision(type);
  dragShape = {
    ox: x, oy: y,
    unitPath: buildUnitPath(type),
    color: dec.color,
    alpha: dec.alpha,
    lw: dec.lw,
    useFill: dec.useFill
  };
  strokeBlend = cfg.blend;
  strokeAlpha = 1;
  clearStrokeBuf();
  strokeActive = true;
  renderDragShape(x, y);
}

function renderDragShape(x, y) {
  const ds = dragShape;
  if (!ds) return;

  const dx = x - ds.ox, dy = y - ds.oy;
  const dist = Math.hypot(dx, dy);
  const radius = dist < 3 ? Math.max(6, cfg.pSize / 2) : dist;
  const rot = Math.atan2(dy, dx);

  clearStrokeBuf();

  const g = sctx;
  g.save();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  g.translate(ds.ox, ds.oy);
  g.rotate(rot);

  if (ds.isCustom) {
    const maxDim = Math.max(ds.shapeW, ds.shapeH);
    const s = (radius * 2) / maxDim;
    g.drawImage(ds.shapeCanvas,
                -ds.shapeW * s / 2, -ds.shapeH * s / 2,
                ds.shapeW * s, ds.shapeH * s);
  } else {
    g.scale(radius, radius);
    g.lineWidth = Math.max(0.0008, ds.lw / radius);
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.fillStyle = ds.color;
    g.strokeStyle = ds.color;
    if (ds.useFill) g.fill(ds.unitPath);
    else            g.stroke(ds.unitPath);
  }

  g.restore();
  scheduleRender();
}

/* =========================================================
   绘画
   ========================================================= */
let strokeColor = '#fff';
let strokePts   = [];
let lastPt      = { x: 0, y: 0 };
let smoothPt    = { x: 0, y: 0 };
let linePrev    = { x: 0, y: 0 };
let lineLastMid = { x: 0, y: 0 };

let strokeOriginX = 0;
let strokeOriginY = 0;

let lineProgress = 0;
const LINE_GRADIENT_LENGTH = 320;

let lastPointerPos = { x: 0, y: 0 };

function clearStrokeBuf() {
  sctx.save();
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.clearRect(0, 0, strokeBuf.width, strokeBuf.height);
  sctx.restore();
}

function prepStrokeCtx() {
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.globalCompositeOperation = 'source-over';
  sctx.globalAlpha = 1;
  sctx.lineCap = 'round';
  sctx.lineJoin = 'round';
  sctx.strokeStyle = strokeColor;
  sctx.fillStyle = strokeColor;
  sctx.lineWidth = cfg.bWidth;
}

function updateLineSegmentColor(segLen) {
  const r = hueRange();

  if (cfg.hueRandom) {
    let h = baseHsl.h + (Math.random() * 2 - 1) * r;
    h = ((h % 360) + 360) % 360;
    sctx.strokeStyle = `hsl(${h.toFixed(1)} ${baseHsl.s.toFixed(1)}% ${baseHsl.l.toFixed(1)}%)`;
    return;
  }

  if (r <= 0) {
    sctx.strokeStyle = `hsl(${baseHsl.h.toFixed(1)} ${baseHsl.s.toFixed(1)}% ${baseHsl.l.toFixed(1)}%)`;
    return;
  }

  lineProgress += segLen;
  const t = (lineProgress / LINE_GRADIENT_LENGTH) % 1;
  let h = baseHsl.h - r + 2 * r * t;
  h = ((h % 360) + 360) % 360;
  sctx.strokeStyle = `hsl(${h.toFixed(1)} ${baseHsl.s.toFixed(1)}% ${baseHsl.l.toFixed(1)}%)`;
}

function redrawLasso() {
  clearStrokeBuf();
  prepStrokeCtx();

  const pts = strokePts;
  const n = pts.length;
  const rad = Math.max(0.5, cfg.bWidth / 2);
  const isErase = cfg.paintMode === 'erase';
  const isFill  = cfg.paintMode === 'fill';

  if (n === 0) return;

  if (n === 1) {
    const col = isErase ? '#000' : strokeColor;
    sctx.beginPath();
    sctx.arc(pts[0].x, pts[0].y, rad, 0, TAU);
    sctx.fillStyle = col;
    sctx.fill();
    return;
  }

  if (n === 2) {
    const col = isErase ? '#000' : strokeColor;
    sctx.beginPath();
    sctx.moveTo(pts[0].x, pts[0].y);
    sctx.lineTo(pts[1].x, pts[1].y);
    sctx.strokeStyle = col;
    sctx.lineWidth = cfg.bWidth;
    sctx.lineCap = 'round';
    sctx.stroke();
    return;
  }

  sctx.beginPath();
  const mx0 = (pts[0].x + pts[1].x) / 2;
  const my0 = (pts[0].y + pts[1].y) / 2;
  sctx.moveTo(mx0, my0);

  for (let i = 1; i < n - 1; i++) {
    const cur  = pts[i];
    const next = pts[i + 1];
    const mx = (cur.x + next.x) / 2;
    const my = (cur.y + next.y) / 2;
    sctx.quadraticCurveTo(cur.x, cur.y, mx, my);
  }
  const last = pts[n - 1];
  sctx.quadraticCurveTo(last.x, last.y, mx0, my0);
  sctx.closePath();

  if (isErase) {
    sctx.fillStyle = '#000';
    sctx.strokeStyle = '#000';
    sctx.lineWidth = cfg.bWidth;
    sctx.lineJoin = 'round';
    sctx.lineCap = 'round';
    sctx.fill();
    sctx.stroke();
    return;
  }

  if (isFill && fillSectorColors) {
    const cx = strokeOriginX;
    const cy = strokeOriginY;

    let maxR = 0;
    for (let i = 0; i < n; i++) {
      const d = Math.hypot(pts[i].x - cx, pts[i].y - cy);
      if (d > maxR) maxR = d;
    }
    maxR += cfg.bWidth;
    if (maxR < 4) maxR = 4;

    const sectorCanvas = buildSectorCanvas(maxR);

    sctx.save();
    sctx.clip();
    sctx.drawImage(sectorCanvas, cx - maxR, cy - maxR, maxR * 2, maxR * 2);
    sctx.restore();
    return;
  }

  sctx.fillStyle = strokeColor;
  sctx.strokeStyle = strokeColor;
  sctx.fill();
  sctx.stroke();
}

function startPaintStroke(x, y) {
  strokeOriginX = x;
  strokeOriginY = y;

  if (cfg.paintMode === 'fill') {
    initFillSectors();
    const rgb = fillSectorColors[0];
    strokeColor = `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
  } else {
    strokeColor = nextColor();
  }

  if (cfg.paintMode === 'line') lineProgress = 0;

  strokeBlend = cfg.paintMode === 'erase' ? 'destination-out' : cfg.blend;
  strokeAlpha = cfg.paintMode === 'erase' ? 1 : Math.max(0.02, cfg.bAlpha);

  clearStrokeBuf();
  prepStrokeCtx();

  lastPt.x = smoothPt.x = x;
  lastPt.y = smoothPt.y = y;
  strokePts = [{ x, y }];

  sctx.beginPath();
  sctx.arc(x, y, Math.max(0.5, cfg.bWidth / 2), 0, TAU);
  sctx.fill();

  if (cfg.paintMode === 'line') {
    linePrev.x = lineLastMid.x = x;
    linePrev.y = lineLastMid.y = y;
  }

  strokeActive = true;
  scheduleRender();
}

function continuePaintStroke(x, y) {
  if (!strokeActive) return;

  if (cfg.paintMode === 'line') {
    const k = 1 - cfg.bSmooth;
    smoothPt.x += (x - smoothPt.x) * k;
    smoothPt.y += (y - smoothPt.y) * k;

    const dx = smoothPt.x - linePrev.x;
    const dy = smoothPt.y - linePrev.y;
    const segLen = Math.hypot(dx, dy);
    if (segLen < 0.6) return;

    const mx = (linePrev.x + smoothPt.x) / 2;
    const my = (linePrev.y + smoothPt.y) / 2;

    updateLineSegmentColor(segLen);

    sctx.beginPath();
    sctx.moveTo(lineLastMid.x, lineLastMid.y);
    sctx.quadraticCurveTo(linePrev.x, linePrev.y, mx, my);
    sctx.stroke();

    lineLastMid.x = mx;
    lineLastMid.y = my;
    linePrev.x = smoothPt.x;
    linePrev.y = smoothPt.y;

  } else {
    const dx = x - lastPt.x, dy = y - lastPt.y;
    if (dx * dx + dy * dy < 1.44) return;

    strokePts.push({ x, y });
    if (strokePts.length > 4000) strokePts.shift();
    lastPt.x = x;
    lastPt.y = y;

    redrawLasso();
  }

  scheduleRender();
}

function commitStroke() {
  if (!strokeActive) return;

  if (cfg.tool === 'paint' && cfg.paintMode === 'line') {
    sctx.beginPath();
    sctx.moveTo(lineLastMid.x, lineLastMid.y);
    sctx.quadraticCurveTo(linePrev.x, linePrev.y, linePrev.x, linePrev.y);
    sctx.stroke();
  }

  const activeMask = getActiveMaskCvs();
  if (activeMask) {
    sctx.save();
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.globalCompositeOperation = 'destination-in';
    sctx.drawImage(activeMask, 0, 0);
    sctx.globalCompositeOperation = 'source-over';
    sctx.restore();
  }

  bctx.save();
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.globalCompositeOperation = strokeBlend;
  bctx.globalAlpha = strokeAlpha;
  bctx.drawImage(strokeBuf, 0, 0);
  bctx.restore();

  clearStrokeBuf();
  strokeActive = false;
  renderView();
}

/* =========================================================
   液化
   ========================================================= */
let lqOrigData = null;
let lqDispX = null;
let lqDispY = null;
let lqDispSize = 0;
let lqDirtyBox = null;
let lqPending = false;
let lqMask = null;

function computeLiquifyMask() {
  const m = getActiveMaskCvs();
  if (!m) { lqMask = null; return; }

  const W = baseCvs.width, H = baseCvs.height;
  const mctx = m.getContext('2d');
  const data = mctx.getImageData(0, 0, W, H).data;
  const mask = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) {
    mask[i] = data[i * 4 + 3] > 128 ? 1 : 0;
  }
  lqMask = mask;
}

function startLiquifySession() {
  const W = baseCvs.width, H = baseCvs.height;
  lqOrigData = bctx.getImageData(0, 0, W, H);

  const size = W * H;
  if (lqDispSize !== size) {
    lqDispX = new Float32Array(size);
    lqDispY = new Float32Array(size);
    lqDispSize = size;
  } else {
    lqDispX.fill(0);
    lqDispY.fill(0);
  }

  computeLiquifyMask();

  lqDirtyBox = null;
  lqPending = false;
}

function endLiquifySession() {
  lqOrigData = null;
  lqDispX = null;
  lqDispY = null;
  lqDispSize = 0;
  lqDirtyBox = null;
  lqPending = false;
  lqMask = null;
}

function updateDisplacement(cx, cy, dx, dy) {
  if (!lqDispX) return;

  const rP  = cfg.lqSize * dpr;
  const cxP = cx * dpr;
  const cyP = cy * dpr;

  const W = baseCvs.width, H = baseCvs.height;
  const r2P = rP * rP;
  const strength = cfg.lqStrength;
  const mode = cfg.lqMode;
  const dxP = dx * dpr;
  const dyP = dy * dpr;

  const bx0 = Math.max(0, Math.floor(cxP - rP));
  const by0 = Math.max(0, Math.floor(cyP - rP));
  const bx1 = Math.min(W, Math.ceil(cxP + rP));
  const by1 = Math.min(H, Math.ceil(cyP + rP));
  if (bx1 <= bx0 || by1 <= by0) return;

  for (let y = by0; y < by1; y++) {
    const gy = y - cyP;
    const rowBase = y * W;
    for (let x = bx0; x < bx1; x++) {
      const gx = x - cxP;
      const d2 = gx * gx + gy * gy;
      if (d2 > r2P) continue;
      if (lqMask && !lqMask[rowBase + x]) continue;

      const d = Math.sqrt(d2);
      const t = d / rP;
      const w2 = 0.5 * (1 + Math.cos(Math.PI * t));
      const idx = rowBase + x;

      if (mode === 'push') {
        lqDispX[idx] += dxP * w2 * strength;
        lqDispY[idx] += dyP * w2 * strength;
      } else {
        const invD = d < 0.001 ? 0 : 1 / d;
        const nx = gx * invD;
        const ny = gy * invD;
        const amt = w2 * strength * 4;
        if (mode === 'pinch') {
          lqDispX[idx] -= nx * amt;
          lqDispY[idx] -= ny * amt;
        } else {
          lqDispX[idx] += nx * amt;
          lqDispY[idx] += ny * amt;
        }
      }
    }
  }

  if (!lqDirtyBox) {
    lqDirtyBox = { x0: bx0, y0: by0, x1: bx1, y1: by1 };
  } else {
    if (bx0 < lqDirtyBox.x0) lqDirtyBox.x0 = bx0;
    if (by0 < lqDirtyBox.y0) lqDirtyBox.y0 = by0;
    if (bx1 > lqDirtyBox.x1) lqDirtyBox.x1 = bx1;
    if (by1 > lqDirtyBox.y1) lqDirtyBox.y1 = by1;
  }
}

function renderLiquify() {
  if (!lqOrigData || !lqDispX || !lqDirtyBox) return;

  const W = baseCvs.width, H = baseCvs.height;
  const { x0: bx0, y0: by0, x1: bx1, y1: by1 } = lqDirtyBox;

  let maxDisp = 0;
  for (let y = by0; y < by1; y++) {
    const rowBase = y * W;
    for (let x = bx0; x < bx1; x++) {
      const idx = rowBase + x;
      const ax = Math.abs(lqDispX[idx]);
      const ay = Math.abs(lqDispY[idx]);
      if (ax > maxDisp) maxDisp = ax;
      if (ay > maxDisp) maxDisp = ay;
    }
  }
  maxDisp = Math.ceil(maxDisp) + 2;

  const sx0 = Math.max(0, bx0 - maxDisp);
  const sy0 = Math.max(0, by0 - maxDisp);
  const sx1 = Math.min(W, bx1 + maxDisp);
  const sy1 = Math.min(H, by1 + maxDisp);
  const sw = sx1 - sx0;
  const sh = sy1 - sy0;
  if (sw <= 0 || sh <= 0) return;

  const src = lqOrigData.data;
  const srcW = lqOrigData.width;
  const srcH = lqOrigData.height;

  const pw = bx1 - bx0;
  const ph = by1 - by0;
  const dst = new Uint8ClampedArray(pw * ph * 4);

  const isGrain = (cfg.lqStyle === 'grain');

  for (let y = 0; y < ph; y++) {
    const gy = by0 + y;
    const rowBase = gy * W;
    const dstRowBase = y * pw * 4;

    for (let x = 0; x < pw; x++) {
      const gx = bx0 + x;
      const idx = rowBase + gx;
      const dstOff = dstRowBase + x * 4;

      if (lqMask && !lqMask[idx]) {
        const origOff = idx * 4;
        dst[dstOff]     = src[origOff];
        dst[dstOff + 1] = src[origOff + 1];
        dst[dstOff + 2] = src[origOff + 2];
        dst[dstOff + 3] = src[origOff + 3];
        continue;
      }

      const ssx = gx - lqDispX[idx];
      const ssy = gy - lqDispY[idx];

      if (isGrain) {
        const x1i = Math.round(ssx);
        const y1i = Math.round(ssy);
        const cx1 = Math.max(0, Math.min(srcW - 1, x1i));
        const cy1 = Math.max(0, Math.min(srcH - 1, y1i));
        const i11 = (cy1 * srcW + cx1) * 4;

        dst[dstOff]     = src[i11];
        dst[dstOff + 1] = src[i11 + 1];
        dst[dstOff + 2] = src[i11 + 2];
        dst[dstOff + 3] = src[i11 + 3];

      } else {
        const x1i = Math.floor(ssx);
        const y1i = Math.floor(ssy);
        const fx  = ssx - x1i;
        const fy  = ssy - y1i;

        const cx1 = Math.max(0, Math.min(srcW - 1, x1i));
        const cy1 = Math.max(0, Math.min(srcH - 1, y1i));
        const cx2 = Math.max(0, Math.min(srcW - 1, x1i + 1));
        const cy2 = Math.max(0, Math.min(srcH - 1, y1i + 1));

        const i11 = (cy1 * srcW + cx1) * 4;
        const i21 = (cy1 * srcW + cx2) * 4;
        const i12 = (cy2 * srcW + cx1) * 4;
        const i22 = (cy2 * srcW + cx2) * 4;

        const w11 = (1 - fx) * (1 - fy);
        const w21 = fx * (1 - fy);
        const w12 = (1 - fx) * fy;
        const w22 = fx * fy;

        dst[dstOff]     = src[i11]     * w11 + src[i21]     * w21 + src[i12]     * w12 + src[i22]     * w22;
        dst[dstOff + 1] = src[i11 + 1] * w11 + src[i21 + 1] * w21 + src[i12 + 1] * w12 + src[i22 + 1] * w22;
        dst[dstOff + 2] = src[i11 + 2] * w11 + src[i21 + 2] * w21 + src[i12 + 2] * w12 + src[i22 + 2] * w22;
        dst[dstOff + 3] = src[i11 + 3] * w11 + src[i21 + 3] * w21 + src[i12 + 3] * w12 + src[i22 + 3] * w22;
      }
    }
  }

  const outImg = new ImageData(dst, pw, ph);
  bctx.putImageData(outImg, bx0, by0);

  lqDirtyBox = null;
  renderView();
}

let lqActive  = false;
let lqPrevX   = 0;
let lqPrevY   = 0;
let lqPointerId = null;

/* ★ 更新液化光标：修饰键/中键按下时隐藏 */
function updateLqCursor(x, y, e) {
  if (cfg.tool !== 'liquify' || tfActive) {
    lqCursor.style.display = 'none';
    return;
  }
  if (e && (e.altKey || e.ctrlKey || e.metaKey || (e.buttons & 4))) {
    lqCursor.style.display = 'none';
    return;
  }
  const size = cfg.lqSize;
  lqCursor.style.display = 'block';
  lqCursor.style.left = x + 'px';
  lqCursor.style.top  = y + 'px';
  lqCursor.style.width  = (size * 2) + 'px';
  lqCursor.style.height = (size * 2) + 'px';
}

/* =========================================================
   Alt 吸色
   ========================================================= */
const colorInputEl = document.getElementById('baseColor');
let altPressed = false;
let ctrlPressed = false;

function updateModifierCursor() {
  if (tfActive) return;
  if (altPressed) {
    cvs.classList.add('picking');
    cvs.classList.remove('moving');
  } else if (ctrlPressed) {
    cvs.classList.add('moving');
    cvs.classList.remove('picking');
  } else {
    cvs.classList.remove('picking');
    cvs.classList.remove('moving');
  }
}

function pickColorAt(cssX, cssY) {
  const px = Math.round(cssX * dpr);
  const py = Math.round(cssY * dpr);
  if (px < 0 || py < 0 || px >= baseCvs.width || py >= baseCvs.height) return;

  const d = bctx.getImageData(px, py, 1, 1).data;
  let hex;
  if (d[3] < 10) {
    hex = cfg.bg;
  } else {
    hex = rgbToHex(d[0], d[1], d[2]);
  }
  applyNewBaseColor(hex);
  showToast('已吸取 ' + hex);
}

function applyNewBaseColor(hex) {
  cfg.baseColor = hex;
  updateBaseHsl();
  colorInputEl.value = hex;
}

/* =========================================================
   指针输入
   ========================================================= */
let drawing   = false;
let ptrId     = null;
let placePrev = { x: 0, y: 0 };
let placeAcc  = 0;

function abortActive() {
  if (tfActive) { cancelTransform(); return; }

  if (dragShape) {
    dragShape = null;
    strokeActive = false;
    clearStrokeBuf();
    renderView();
  }
  if (drawing) { drawing = false; ptrId = null; }
  if (lqActive) {
    lqActive = false;
    lqPointerId = null;
    endLiquifySession();
  }
  if (lassoActive) {
    lassoActive = false;
    lassoPoints = [];
    lassoPointerId = null;
  }
  if (moveActive) endMove();
  lqCursor.style.display = 'none';
}

cvs.addEventListener('pointerdown', e => {
  /* ★ 自由变换优先拦截 */
  if (tfActive) {
    e.preventDefault();
    const hit = tfHitTest(e.clientX, e.clientY);
    if (!hit) { commitTransform(); return; }

    const c = getQuadCenter(tfQuad);
    tfDrag = {
      pointerId: e.pointerId,
      type: hit.type,
      i: hit.i,
      startX: e.clientX,
      startY: e.clientY,
      origQuad: tfQuad.map(p => ({ x: p.x, y: p.y })),
      center: c,
      startAngle: Math.atan2(e.clientY - c.y, e.clientX - c.x)
    };
    cvs.setPointerCapture(e.pointerId);
    updateTransformCursor(hit);
    return;
  }

  if (e.altKey && e.button !== 1) {
    e.preventDefault();
    pickColorAt(e.clientX, e.clientY);
    return;
  }

  if (e.button === 1) {
    e.preventDefault();
    lassoActive = true;
    lassoPointerId = e.pointerId;
    cvs.setPointerCapture(e.pointerId);
    lassoPoints = [{ x: e.clientX, y: e.clientY }];

    if (e.shiftKey) {
      lassoModifier = 'add';
      lassoColor = '#7dffb0';
    } else if (e.altKey) {
      lassoModifier = 'sub';
      lassoColor = '#ff7b7b';
    } else {
      lassoModifier = 'new';
      lassoColor = '#6ee7ff';
    }

    lqCursor.style.display = 'none';

    startDashAnim();
    renderView();
    return;
  }

  if (e.ctrlKey && e.button === 0) {
    e.preventDefault();
    lqCursor.style.display = 'none';
    startMove(e.clientX, e.clientY, e.pointerId);
    return;
  }

  if (selecting) {
    e.preventDefault();
    isSelDragging = true;
    selPointerId = e.pointerId;
    cvs.setPointerCapture(e.pointerId);
    selStartX = selEndX = e.clientX;
    selStartY = selEndY = e.clientY;
    updateSelOverlay();
    return;
  }

  e.preventDefault();
  if (drawing || lqActive) return;

  const x = e.clientX, y = e.clientY;
  const pressure = e.pressure > 0 ? e.pressure : 0.5;

  if (cfg.tool === 'place' && cfg.shape === 'custom' && !hasAnyCustomShape()) {
    showToast('请点击右上角的「自定义形状」框选载入至少一个形状');
    return;
  }

  if (cfg.tool === 'liquify') {
    lqActive = true;
    lqPointerId = e.pointerId;
    cvs.setPointerCapture(e.pointerId);
    lqPrevX = x;
    lqPrevY = y;
    takeSnapshot();
    startLiquifySession();
    return;
  }

  drawing = true;
  ptrId = e.pointerId;
  cvs.setPointerCapture(e.pointerId);

  takeSnapshot();

  if (cfg.tool === 'place') {
    strokeBlend = cfg.blend;
    strokeAlpha = 1;
    clearStrokeBuf();
    strokeActive = true;

    if (cfg.ctrlMode === 'scatter') {
      placePrev.x = x;
      placePrev.y = y;
      placeAcc = 0;
      stampShape(x, y, pressure);
    } else {
      startDragShape(x, y);
    }
  } else {
    startPaintStroke(x, y);
  }
}, { passive: false });

cvs.addEventListener('pointermove', e => {
  lastPointerPos.x = e.clientX;
  lastPointerPos.y = e.clientY;

  /* ★ 自由变换交互 */
  if (tfActive) {
    if (tfDrag && e.pointerId === tfDrag.pointerId) {
      e.preventDefault();
      applyTransformDrag(e);
    } else {
      updateTransformCursor(tfHitTest(e.clientX, e.clientY));
    }
    return;
  }

  if (e.altKey && (e.buttons & 1) && !(e.buttons & 4)) {
    e.preventDefault();
    pickColorAt(e.clientX, e.clientY);
    return;
  }

  if (lassoActive && e.pointerId === lassoPointerId) {
    e.preventDefault();
    const x = e.clientX, y = e.clientY;
    const last = lassoPoints[lassoPoints.length - 1];
    if (Math.hypot(x - last.x, y - last.y) < 2) return;
    lassoPoints.push({ x, y });
    renderView();
    return;
  }

  if (moveActive && e.pointerId === movePointerId) {
    e.preventDefault();
    updateMove(e.clientX, e.clientY);
    return;
  }

  if (cfg.tool === 'liquify') updateLqCursor(e.clientX, e.clientY, e);

  if (isSelDragging && e.pointerId === selPointerId) {
    e.preventDefault();
    selEndX = e.clientX;
    selEndY = e.clientY;
    updateSelOverlay();
    return;
  }

  if (lqActive && e.pointerId === lqPointerId) {
    e.preventDefault();
    const x = e.clientX, y = e.clientY;
    const dx = x - lqPrevX;
    const dy = y - lqPrevY;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.4) return;

    const STEP_PX = 3;
    let steps = Math.max(1, Math.ceil(dist / STEP_PX));
    if (steps > 30) steps = 30;
    const stepX = dx / steps;
    const stepY = dy / steps;

    for (let i = 1; i <= steps; i++) {
      const px = lqPrevX + stepX * i;
      const py = lqPrevY + stepY * i;
      updateDisplacement(px, py, stepX, stepY);
    }

    lqPrevX = x;
    lqPrevY = y;

    if (!lqPending) {
      lqPending = true;
      requestAnimationFrame(() => {
        lqPending = false;
        if (lqActive) renderLiquify();
      });
    }
    return;
  }

  if (!drawing || e.pointerId !== ptrId) return;
  e.preventDefault();

  const x = e.clientX, y = e.clientY;
  const pressure = e.pressure > 0 ? e.pressure : 0.5;

  if (cfg.tool === 'place') {
    if (cfg.ctrlMode === 'scatter') {
      const dx = x - placePrev.x, dy = y - placePrev.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.01) return;

      const ux = dx / dist, uy = dy / dist;
      const spacing = Math.max(2, cfg.pSpacing);
      let travelled = 0;

      while (placeAcc + (dist - travelled) >= spacing) {
        const need = spacing - placeAcc;
        travelled += need;
        placeAcc = 0;
        stampShape(
          placePrev.x + ux * travelled,
          placePrev.y + uy * travelled,
          pressure
        );
      }
      placeAcc += dist - travelled;
      placePrev.x = x;
      placePrev.y = y;

    } else {
      renderDragShape(x, y);
    }

  } else {
    continuePaintStroke(x, y);
  }
}, { passive: false });

cvs.addEventListener('pointerleave', () => {
  if (!lqActive) lqCursor.style.display = 'none';
});
cvs.addEventListener('pointerenter', e => {
  if (cfg.tool === 'liquify') updateLqCursor(e.clientX, e.clientY, e);
});

function endStroke(e) {
  /* ★ 变换拖拽结束 */
  if (tfActive) {
    if (tfDrag && (!e || e.pointerId === tfDrag.pointerId)) {
      tfDrag = null;
      updateTransformCursor(tfHitTest(lastPointerPos.x, lastPointerPos.y));
    }
    return;
  }

  if (lassoActive && (!e || e.pointerId === lassoPointerId)) {
    lassoActive = false;
    lassoPointerId = null;

    if (lassoPoints.length >= 3) {
      const pts = lassoPoints.slice();
      if (lassoModifier === 'new' || selectionOps.length === 0) {
        selectionOps = [{ points: pts, op: 'new' }];
        selectionInverted = false;
      } else {
        selectionOps.push({ points: pts, op: lassoModifier });
      }
      rebuildSelection();
    }

    lassoPoints = [];
    renderView();
    return;
  }

  if (moveActive && (!e || e.pointerId === movePointerId)) {
    endMove();
    return;
  }

  if (lqActive && (!e || e.pointerId === lqPointerId)) {
    if (lqDirtyBox) renderLiquify();
    lqActive = false;
    lqPointerId = null;
    endLiquifySession();
    return;
  }

  if (isSelDragging && (!e || e.pointerId === selPointerId)) {
    isSelDragging = false;

    const left = Math.min(selStartX, selEndX);
    const top  = Math.min(selStartY, selEndY);
    const w = Math.abs(selEndX - selStartX);
    const h = Math.abs(selEndY - selStartY);

    selOverlay.style.display = 'none';
    selPointerId = null;

    if (w > 8 && h > 8) {
      cropShape(left, top, w, h);
      exitSelectionMode();
    }
    return;
  }

  if (!drawing) return;
  if (e && e.pointerId !== ptrId) return;
  drawing = false;
  ptrId = null;

  if (cfg.tool === 'place') {
    if (strokeActive) commitStroke();
    dragShape = null;
  } else {
    commitStroke();
  }
}
cvs.addEventListener('pointerup', endStroke);
cvs.addEventListener('pointercancel', endStroke);

cvs.addEventListener('mousedown', e => {
  if (e.button === 1) e.preventDefault();
});
cvs.addEventListener('auxclick', e => {
  if (e.button === 1) e.preventDefault();

/* =========================================================
   粘贴图片
   ========================================================= */
window.addEventListener('paste', e => {
  let imageBlob = null;

  const items = e.clipboardData && e.clipboardData.items;
  if (items) {
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image') === 0) {
        imageBlob = items[i].getAsFile();
        break;
      }
    }
  }

  if (!imageBlob && e.clipboardData && e.clipboardData.files) {
    for (let i = 0; i < e.clipboardData.files.length; i++) {
      const f = e.clipboardData.files[i];
      if (f.type && f.type.indexOf('image') === 0) {
        imageBlob = f;
        break;
      }
    }
  }

  if (!imageBlob) return;
  e.preventDefault();

  const url = URL.createObjectURL(imageBlob);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    pasteImageToCanvas(img);
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    showToast('图片加载失败');
  };
  img.src = url;
});

function pasteImageToCanvas(img) {
  lastSnap = 0;
  takeSnapshot();

  const maxW = window.innerWidth  * 0.8;
  const maxH = window.innerHeight * 0.8;
  const scale = Math.min(maxW / img.width, maxH / img.height, 1);
  const drawW = img.width  * scale;
  const drawH = img.height * scale;

  let cx, cy;
  if (lastPointerPos.x > 0 && lastPointerPos.y > 0) {
    cx = lastPointerPos.x;
    cy = lastPointerPos.y;
  } else {
    cx = window.innerWidth  / 2;
    cy = window.innerHeight / 2;
  }

  const dx = cx - drawW / 2;
  const dy = cy - drawH / 2;

  const W = baseCvs.width, H = baseCvs.height;
  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = H;
  const tctx = tmp.getContext('2d');
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tctx.drawImage(img, dx, dy, drawW, drawH);

  const activeMask = getActiveMaskCvs();
  if (activeMask) {
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.globalCompositeOperation = 'destination-in';
    tctx.drawImage(activeMask, 0, 0);
    tctx.globalCompositeOperation = 'source-over';
  }

  bctx.save();
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.globalCompositeOperation = 'source-over';
  bctx.globalAlpha = 1;
  bctx.drawImage(tmp, 0, 0);
  bctx.restore();

  renderView();
  showToast('已粘贴图片');
}

/* =========================================================
   撤销 / 清空 / 保存
   ========================================================= */
const history = [];
let lastSnap = 0;

function takeSnapshot() {
  const now = performance.now();
  if (now - lastSnap < 350 && history.length) return;
  lastSnap = now;
  try {
    history.push(baseCvs.toDataURL('image/png'));
    if (history.length > 16) history.shift();
  } catch (err) {}
}

function undo() {
  const url = history.pop();
  if (!url) return;
  const img = new Image();
  img.onload = () => {
    bctx.save();
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.globalCompositeOperation = 'source-over';
    bctx.globalAlpha = 1;
    bctx.clearRect(0, 0, baseCvs.width, baseCvs.height);
    bctx.drawImage(img, 0, 0);
    bctx.restore();
    renderView();
  };
  img.src = url;
}

function clearAll() {
  takeSnapshot();
  clearStrokeBuf();
  strokeActive = false;
  dragShape = null;
  bctx.save();
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.globalCompositeOperation = 'source-over';
  bctx.globalAlpha = 1;
  bctx.clearRect(0, 0, baseCvs.width, baseCvs.height);
  bctx.restore();
  renderView();
}

function savePNG() {
  const a = document.createElement('a');
  a.download = `geometry-${Date.now()}.png`;
  a.href = baseCvs.toDataURL('image/png');
  a.click();
}

/* ---------- 快捷键 ---------- */
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();

  /* ★ 自由变换激活时独占快捷键 */
  if (tfActive) {
    if (e.key === 'Escape') { e.preventDefault(); cancelTransform(); return; }
    if (e.key === 'Enter')  { e.preventDefault(); commitTransform(); return; }
    if (k === 't') { e.preventDefault(); commitTransform(); return; }
    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); cancelTransform(); return; }
    return;
  }

  if (e.altKey && !altPressed) {
    altPressed = true;
    updateModifierCursor();
  }
  if ((e.ctrlKey || e.metaKey) && !ctrlPressed) {
    ctrlPressed = true;
    updateModifierCursor();
  }

  /* ★ Ctrl/Cmd + T → 自由变换 */
  if (k === 't') {
    e.preventDefault();
    enterTransform();
    return;
  }

  if ((e.ctrlKey || e.metaKey) && k === 'd') {
    e.preventDefault();
    clearSelection();
    return;
  }

  if ((e.ctrlKey || e.metaKey) && k === 'i') {
    e.preventDefault();
    invertSelection();
    return;
  }

  if ((e.ctrlKey || e.metaKey) && k === 'z') {
    e.preventDefault();
    undo();
    return;
  }

  if (e.key === 'Escape') {
    if (lassoActive) { lassoActive = false; lassoPoints = []; renderView(); return; }
    if (moveActive) { endMove(); return; }
    if (hasSelection()) { clearSelection(); return; }
    if (selecting) { exitSelectionMode(); return; }
  }
});

window.addEventListener('keyup', e => {
  if (!e.altKey && altPressed) {
    altPressed = false;
    updateModifierCursor();
  }
  if (!e.ctrlKey && !e.metaKey && ctrlPressed) {
    ctrlPressed = false;
    updateModifierCursor();
  }
});

applyTool(cfg.tool);
applyCtrlMode(cfg.ctrlMode);
applyPlaceMode(cfg.pMode);
applyPaintMode(cfg.paintMode);
applyLqMode(cfg.lqMode);
applyLqStyle(cfg.lqStyle);
renderView();

requestAnimationFrame(() => {
  for (let i = 0; i < CUSTOM_SLOT_COUNT; i++) updateSlotPreview(i);
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    resize();
    for (let i = 0; i < CUSTOM_SLOT_COUNT; i++) updateSlotPreview(i);
  }, 120);
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    resize();
    for (let i = 0; i < CUSTOM_SLOT_COUNT; i++) updateSlotPreview(i);
  }, 250);
});

})();
</script>
</body>
</html>
